services:
  cockroach:
    image: cockroachdb/cockroach:v26.1.3
    command: start-single-node --insecure --store=/cockroach/cockroach-data
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--execute=SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - cockroach-data:/cockroach/cockroach-data

  migrate:
    image: cockroachdb/cockroach:v26.1.3
    depends_on:
      cockroach:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      cockroach sql --insecure --host=cockroach --execute='CREATE DATABASE IF NOT EXISTS reliability_memory' &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/001_reliability_memory.sql &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/002_security.sql &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/003_demo_seed.sql &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/004_correction_vector_partition.sql &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/005_demo_case_names.sql &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/006_langgraph_review_receipts.sql &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/007_payment_ledger_evidence.sql &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/008_analyst_case_catalog.sql &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/009_customer_resolution_evidence.sql &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/010_embedding_provenance.sql &&
      cockroach sql --insecure --host=cockroach --database=reliability_memory --file=/migrations/011_managed_mcp_verification.sql

  catalog-seed:
    image: python:3.13-slim
    working_dir: /project
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./:/project:ro
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/reliability_memory?sslmode=disable
    command: >-
      sh -c "pip install --no-cache-dir 'psycopg[binary]>=3.2,<4' && python scripts/seed_case_catalog.py"

  api:
    image: python:3.13-slim
    working_dir: /app
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
    volumes:
      - ./services/api:/app
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/reliability_memory?sslmode=disable
      USE_BEDROCK: "false"
      CORS_ORIGINS: http://localhost:3000
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  cockroach-data:
